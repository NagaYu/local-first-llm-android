# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required by AGP 8+.
android.useAndroidX=true

# Kotlin code style for this project.
kotlin.code.style=official

# Maven coordinates shared by the publishing config of both library modules.
GROUP=io.github.nagayu
VERSION_NAME=0.1.0

# Shared POM metadata (per-module artifactId/name/description live in each
# module's gradle.properties). Read by the vanniktech maven-publish plugin.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/NagaYu/local-first-llm-android
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/NagaYu/local-first-llm-android
POM_SCM_CONNECTION=scm:git:git://github.com/NagaYu/local-first-llm-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/NagaYu/local-first-llm-android.git
POM_DEVELOPER_ID=nagayu
POM_DEVELOPER_NAME=NagaYu
POM_DEVELOPER_URL=https://github.com/NagaYu
